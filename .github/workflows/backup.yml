name: Backup (database)

on:
  schedule:
    - cron: '0 18 * * *' # 每日 18:00 UTC = 北京时间次日 02:00（低峰窗口）
  workflow_dispatch:

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      # 备份必须"响亮地失败"：secrets 缺失直接红叉并邮件告警，绝不静默跳过
      - name: Check secrets
        run: |
          missing=0
          for v in SUPABASE_DB_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "$(printenv $v)" ]; then echo "::error::缺少 secret: $v"; missing=1; fi
          done
          exit $missing

      - name: Dump database (public schema)
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          docker run --rm postgres:17 pg_dump "$SUPABASE_DB_URL" \
            --schema=public --no-owner --no-privileges \
            | gzip > "milk-transfer-${STAMP}.sql.gz"
          ls -la "milk-transfer-${STAMP}.sql.gz"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Upload to R2 and prune (retain 30 days)
        run: |
          rclone config create r2 s3 \
            provider=Cloudflare \
            access_key_id="$R2_ACCESS_KEY_ID" \
            secret_access_key="$R2_SECRET_ACCESS_KEY" \
            endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --non-interactive
          rclone copy "milk-transfer-${STAMP}.sql.gz" "r2:${R2_BUCKET}/postgres/" --non-interactive
          rclone delete "r2:${R2_BUCKET}/postgres/" --min-age 30d --non-interactive
          echo "已上传 milk-transfer-${STAMP}.sql.gz，保留近 30 天"
